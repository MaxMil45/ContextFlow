name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The Tauri crate embeds app/dist at compile time, so the frontend must be
      # built before clippy/test can compile the workspace.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build

      # The interface against its sample backend (jsdom, no Rust needed).
      - name: Interface tests
        working-directory: app
        run: npm test

      # The extension's pinning logic, against a fake browser.
      - name: Extension test
        run: node extensions/browser/test/pinning.test.js

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # `cargo test` regenerates the TS bindings; fail if they were stale.
      - name: TypeScript bindings up to date
        run: git diff --exit-code -- app/src/bindings

      # The UI must still compile against the bindings `cargo test` just wrote.
      - name: Typecheck the UI against the bindings
        working-directory: app
        run: npm run typecheck

      - name: Build release CLI
        run: cargo build --release -p cf-cli

      - uses: actions/upload-artifact@v4
        with:
          name: contextflow-windows-x64
          path: target/release/contextflow.exe

  installer:
    name: installer (Windows, per-user NSIS)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Builds the CLI programs, bundles them with the app, and makes the installer.
      # Signing runs only when a certificate thumbprint is provided as a secret.
      - name: Build installer
        shell: pwsh
        env:
          CONTEXTFLOW_SIGN_THUMBPRINT: ${{ secrets.CONTEXTFLOW_SIGN_THUMBPRINT }}
        run: ./scripts/build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: contextflow-installer
          path: target/release/bundle/nsis/*.exe
