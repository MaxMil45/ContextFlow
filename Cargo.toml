[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MaxMil45/ContextFlow"

[workspace.dependencies]
cf-core = { path = "crates/cf-core" }
cf-storage = { path = "crates/cf-storage" }
cf-git = { path = "crates/cf-git" }
cf-diff = { path = "crates/cf-diff" }
cf-windows = { path = "crates/cf-windows" }
cf-config = { path = "crates/cf-config" }
cf-browser = { path = "crates/cf-browser" }
cf-vscode = { path = "crates/cf-vscode" }
cf-vstudio = { path = "crates/cf-vstudio" }
cf-explorer = { path = "crates/cf-explorer" }
cf-jetbrains = { path = "crates/cf-jetbrains" }
cf-engine = { path = "crates/cf-engine" }
cf-cli = { path = "crates/cf-cli" }
cf-cleanup = { path = "crates/cf-cleanup" }
cf-app = { path = "crates/cf-app" }

anyhow = "1"
toml = "0.8"
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "ico"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = "0.59"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
