[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-org/contextflow"

[workspace.dependencies]
cf-core = { path = "crates/cf-core" }
cf-storage = { path = "crates/cf-storage" }
cf-adapters = { path = "crates/cf-adapters" }
cf-git = { path = "crates/cf-git" }
cf-diff = { path = "crates/cf-diff" }
cf-windows = { path = "crates/cf-windows" }
cf-config = { path = "crates/cf-config" }
cf-engine = { path = "crates/cf-engine" }

anyhow = "1"
toml = "0.8"
tracing-appender = "0.2"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = "0.59"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
