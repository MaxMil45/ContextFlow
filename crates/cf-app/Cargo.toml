[package]
name = "cf-app"
description = "ContextFlow application services shared by the CLI, the launcher and the desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cf-browser.workspace = true
cf-cleanup.workspace = true
cf-config.workspace = true
cf-core.workspace = true
cf-engine.workspace = true
cf-git.workspace = true
cf-ipc.workspace = true
cf-storage.workspace = true
cf-detect.workspace = true
cf-windows.workspace = true
# `zeroize` also wipes the cipher's own copy of the key when it is dropped.
aes-gcm = { version = "0.10", features = ["zeroize"] }
anyhow.workspace = true
argon2 = "0.5"
zeroize = "1"
chrono.workspace = true
hex.workspace = true
image.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
