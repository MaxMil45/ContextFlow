[package]
name = "cf-cli"
description = "ContextFlow command-line interface and desktop launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cf_cli"
path = "src/lib.rs"

[[bin]]
name = "contextflow"
path = "src/main.rs"

# Started by Chrome/Edge for the extension.
[[bin]]
name = "contextflow-browser-host"
path = "src/browser_host.rs"

# Windowless program that desktop shortcuts start.
[[bin]]
name = "contextflow-launch"
path = "src/launch.rs"

[dependencies]
cf-app.workspace = true
cf-browser.workspace = true
cf-cleanup.workspace = true
cf-config.workspace = true
cf-core.workspace = true
cf-diff.workspace = true
cf-engine.workspace = true
cf-git.workspace = true
cf-storage.workspace = true
cf-vscode.workspace = true
cf-vstudio.workspace = true
cf-explorer.workspace = true
cf-jetbrains.workspace = true
cf-windows.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
image.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
