[package]
name = "cf-detect"
description = "ContextFlow: which folder, solution or project each editor or File Explorer window has open"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# File Explorer's open folders come from the Windows Shell directly (COM).
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
default-features = false
features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell"]

[dev-dependencies]
tempfile.workspace = true
